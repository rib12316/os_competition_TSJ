# F5 实验组 A：vllm 原生（FCFS + APC，无 priority、无应用层调度）。
# 作为 B/C 的对照基线：HBM 满时 vLLM 机械踢人（LRU + 随机/LIFO preempt）。
# 引擎须用本档启动：
#   python -m agent_mem.server.vllm_server --config configs/f5-native.yaml \
#     --model-path models/Qwen2.5-7B-Instruct --tool-call-parser hermes
# 再跑并发 benchmark（固定并发度）：
#   python benchmarks/runner.py --config configs/f5-native.yaml --runner qwen-agent \
#     --engine-url http://localhost:8000/v1 --max-concurrency 6 --device npu
engine:
  backend: vllm-ascend
  model: Qwen2.5-7B-Instruct
  extra_args:
    - "--gpu-memory-utilization 0.3"   # 制造 HBM 压力（F5-experiment-design）
    - "--max-model-len 32768"

benchmark:
  suite: tau-bench
  domain: retail
  runs: 3
  seed: 42

session:                          # 缝E：noop = 不做生命周期管理
  strategy: noop
  idle_timeout_s: 60
  options: {}

metrics:
  - e2e_latency_p50
  - e2e_latency_p95
  - qps
  - mem_peak_mb
  - kv_cache_hit_rate
  - task_success_rate
  - ttft
