# 统一 benchmark · tau-bench + F5 用户活跃度仿真
# 多轮工具调用 + 并发 + think-time profiles（模拟异质用户交互节奏）→ 测 F5 动态资源回收。
# 引擎须用本档启动（priority + 小 KV pool 制压）；runner --max-concurrency>1 走 dynamic 路径。
#
# 启动引擎：
#   python -m agent_mem.server.vllm_server --config configs/unified-tau-freq.yaml \
#     --model-path models/Qwen2.5-7B-Instruct --tool-call-parser hermes
# 跑 benchmark（dynamic 由 session.strategy=combined-evict 自动开启）：
#   python benchmarks/runner.py --config configs/unified-tau-freq.yaml --runner qwen-agent \
#     --engine-url http://localhost:8000/v1 --max-concurrency 6 --device npu
engine:
  backend: vllm-ascend
  model: Qwen2.5-7B-Instruct
  priority_scheduling: true
  kv_transfer:                          # 缝C：lazy CPU offload（被回收 KV 留 CPU 副本）
    connector: SimpleCPUOffloadConnector
    role: kv_both
    extra_config:
      cpu_bytes_to_use: 4294967296      # 4 GiB
      lazy_offload: true
  extra_args:
    - "--gpu-memory-utilization 0.27"   # 制压：小 KV pool 让并发 agent 溢出 → 触发 preempt
    - "--max-model-len 16384"

benchmark:
  suite: tau-bench
  domain: retail
  runs: 3
  seed: 42

session:                                # 缝E：combined 优先级（recency + progress）
  strategy: combined-evict
  idle_timeout_s: 30
  options:
    # 用户活跃度 profile（round-robin 分配到并发 session）：
    # [1,3]=活跃用户 / [8,15]=偶尔 / [30,60]=闲置 —— 驱动 EWMA recency 信号
    think_time_profiles: [[1, 3], [8, 15], [30, 60]]

metrics:
  - e2e_latency_p50
  - e2e_latency_p95
  - qps
  - mem_peak_mb
  - kv_cache_hit_rate
  - task_success_rate
  - ttft
