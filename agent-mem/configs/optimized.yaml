# optimized: prefix cache + C8 int8 KV (F1) + LMCache 分层 (F4)（三档递进最高档，Ascend 专用）
#
# C8 int8 KV 走 `--quantization ascend` + 模型 quant_model_description.json
# （非 no-op 的 `--kv-cache-dtype int8`，见 docs/F1-c8-injection.md）。
# LMCache 分层走 `--kv-transfer-config` 激活 LMCacheAscendConnector（见 docs/F4-lmcache-ascend.md）。
# 本档特性（C8 KV + LMCache）均 Ascend-only → backend 必为 vllm-ascend。
# 前置：python -m agent_mem.kv.c8 annotate models/Qwen2.5-7B-Instruct
#       python -m agent_mem.kv.c8 inject-scales models/Qwen2.5-7B-Instruct
#       NPU 上安装 lmcache_ascend 包（见 docs/F4-lmcache-ascend.md）
engine:
  backend: vllm-ascend            # C8 KV + LMCache 均 Ascend-only
  model: Qwen2.5-7B-Instruct
  extra_args: []
  kv_transfer:                    # 缝C（F4）：NPU↔CPU↔Disk 三级分层
    connector: LMCacheAscendConnector
    role: kv_both
  c8:                             # 缝A（F1）：C8 int8 KV（显存砍半）
    enabled: true
    patch_qwen2: true             # Qwen2.5（Qwen2 架构）需 sitecustomize 补丁

benchmark:
  suite: tau-bench
  domain: retail
  runs: 3
  seed: 42

metrics:
  - e2e_latency_p50
  - e2e_latency_p95
  - qps
  - mem_peak_mb
  - kv_cache_hit_rate
  - task_success_rate
  - ttft
