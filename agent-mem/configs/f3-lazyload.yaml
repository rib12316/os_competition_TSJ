# F3 · 工具调用数据 lazy-load（缝D：上下文中间件 intercept_tool_result）。
# 大结果存 session-scoped SQLite，context 只保留结构摘要和 result_id；模型通过
# fetch_tool_result 分段取回。推理后端仍是本地 vllm-ascend。
#
# 独立性：只开关自己（middleware.active=[lazyload]）；可与 F2 链式组合，但价值不依赖它。
engine:
  backend: vllm-ascend
  model: Qwen2.5-7B-Instruct
  extra_args: []

benchmark:
  suite: tau-bench
  domain: retail
  runs: 3
  seed: 42

middleware:                       # 缝D
  active: [lazyload]
  options:
    lazyload:
      store: sqlite
      store_path: ""             # 空=进程独立 /tmp DB；正式 run 可指定持久路径
      ttl_seconds: 3600
      externalize_trigger_tokens: 4000
      max_reference_tokens: 512
      fetch_max_tokens: 768       # 低于 F2 hot-tool 1k 门槛
      fetch_default_lines: 20
      fetch_max_lines: 100
      max_parse_bytes: 5000000
      on_store_error: passthrough # 成功率优先；可显式改 head_tail/raise
      exempt_tools: [fetch_tool_result]
      tool_overrides: {}

metrics:
  - e2e_latency_p50
  - e2e_latency_p95
  - qps
  - mem_peak_mb
  - kv_cache_hit_rate
  - task_success_rate
  - ttft
