   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #17212b" x="340.56" y="347.2704" transform="rotate(-0 340.56 347.2704)">证据边界</text>
