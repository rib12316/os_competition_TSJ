   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #5f6b76" x="340.56" y="46.5084" transform="rotate(-0 340.56 46.5084)">目标不是改变‘谁被抢占’，而是降低池满后发生重算的频率</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(72.917094 116.723287)">pending sessions</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(72.896 130.313131)">等待进入推理引擎</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(249.673563 98.2186)">RequestAdmissionController</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(320.472 107.7436)"/>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(263.131375 124.0186)">KV &gt; 85%：降低准入上限</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(263.131375 136.538913)">KV &lt; 70%：逐步恢复上限</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(261.345438 149.0436)">70%–85%：保持当前上限</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(508.540687 116.608444)">vLLM running set</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(505.365687 129.508444)">APC + priority 协同</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(501.588969 185.033956)">Prometheus /metrics</text>
