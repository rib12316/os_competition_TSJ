   <g id="text_11">
    <text style="font-size: 9.3px; font-family: 'Noto Sans CJK SC'; fill: #5f6b76" transform="translate(112.796461 366.8013)">以上为 2026-07-29 最终前端 Demo 的一次同配置配对运行（10 任务、conc=6、max_steps=25、seed=42）。</text>
    <text style="font-size: 9.3px; font-family: 'Noto Sans CJK SC'; fill: #5f6b76" transform="translate(134.006273 377.115581)">结果证明当前运行中抢占减少，但尚不足以声称‘稳定归零’；多 seed、多次重复仍是后续验证项。</text>
   </g>
