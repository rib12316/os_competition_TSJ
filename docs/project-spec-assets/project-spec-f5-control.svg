    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(477.973305 208.432902)">preemptions / running / waiting</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(135.411906 250.8236)">baseline（FCFS）</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(114.267375 263.338444)">池利用率触顶 → 抢占与重算</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(95.567375 275.713444)">最终 Demo：7 次抢占，KV hit 0.514</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(150.727531 288.193913)">P50 179.9 s</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(440.902625 250.132975)">ours（准入 + priority 协同）</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(448.445594 263.333756)">在高压区收缩 active 上限</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(423.671375 275.713444)">最终 Demo：3 次抢占，KV hit 0.595</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(478.831531 288.193913)">P50 108.7 s</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK SC'; fill: #2f7d5b" transform="translate(313.724063 240.9908)">抢占 −57%</text>
