   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #5f6b76" x="340.56" y="43.182" transform="rotate(-0 340.56 43.182)">展示最终 Demo 实际执行顺序与每个优化模块的作用位置</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(83.950664 75.315606)">前端 / Benchmark</text>
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(65.94 87.68045)">选择任务、配置与优化档位</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(285.209148 74.827247)">YAML → RuntimeConfig</text>
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(264.724031 86.835098)">构建 Agent / Middleware / Engine</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.2px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(98.416969 137.455456)">F5 请求准入</text>
    <text style="font-size: 9.2px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(65.404063 148.164112)">读取 kv_cache_usage_perc</text>
    <text style="font-size: 9.2px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(74.088 160.336144)">&gt;85% 暂缓，&lt;70% 恢复</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.2px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(284.264563 142.419144)">构造 canonical messages</text>
    <text style="font-size: 9.2px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(283.806 154.038456)">system + tools + 历史消息</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(261.010828 209.178)">MiddlewareStack.transform_request</text>
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(278.861766 221.238)">① F3 注入稳定 fetch schema</text>
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(276.199734 232.488)">② F2 静态精简 + 冷热历史压缩</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(286.464656 284.142938)">OpenAI-compatible 请求</text>
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(271.293328 295.640437)">APC 前缀复用 → Prefill / Decode</text>
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(264.094734 307.301062)">F1 C8 与 F4 connector 在引擎层生效</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(540.58 285.010125)">同步采集</text>
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(506.62575 295.35425)">TTFT / QPS / KV hit / HBM</text>
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(510.650375 306.28)">抢占 / running / waiting</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.2px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(318.812 357.0072)">解析响应</text>
    <text style="font-size: 9.2px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(302.950625 368.5302)">文本回复 → 结束</text>
    <text style="font-size: 9.2px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(282.16725 379.721856)">tool_calls → 执行业务工具</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(83.825688 431.34945)">F3 intercept_tool_result</text>
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(99.742 443.208138)">&lt;阈值：原样保留</text>
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(53.421688 454.0672)">≥阈值：写 ArtifactStore，历史仅留引用</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(284.412 432.181325)">更新会话历史并进入下一轮</text>
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(270.312062 442.9352)">fetch_tool_result 走本地受限读取</text>
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(283.91425 454.226013)">返回内容受 token 上限约束</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(540.58 432.203325)">任务结束</text>
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(497.04475 442.314388)">写 summary / events / metrics</text>
    <text style="font-size: 8.8px; font-family: 'Noto Sans CJK SC'; fill: #17212b" transform="translate(512.945937 453.76745)">前端生成 before / after</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC'; fill: #d97706" transform="translate(79.488 303.6672) rotate(-90)">下一轮</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.3px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #5f6b76" x="340.56" y="492.246" transform="rotate(-0 340.56 492.246)">组合顺序固定为 F3 → F2：先阻止大型工具结果进入历史，再压缩其余上下文。</text>
   </g>
  </g>
 </g>
