  <text x="295" y="235" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#004d40">Benchmark 评测框架</text>

  <rect x="62" y="246" width="145" height="28" rx="3" fill="#e0f2f1" stroke="#80cbc4" stroke-width="0.8"/>
  <text x="134" y="264" text-anchor="middle" font-size="8.5" fill="#004d40">Runner Protocol</text>

