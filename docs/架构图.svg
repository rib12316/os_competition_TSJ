  <text x="550" y="152" text-anchor="middle" font-size="8" fill="#999">metrics.json / f5_driver_snapshot.json / engine logs</text>
  <path d="M550,158 L550,172" stroke="#999" stroke-width="1.5" marker-end="url(#arrowGray)"/>

