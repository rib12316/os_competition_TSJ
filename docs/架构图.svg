  <text x="200" y="649" text-anchor="middle" font-size="7.5" fill="#555">--quantization ascend  ·  post-RoPE 自校准  ·  FULL_DECODE_ONLY</text>

  <rect x="370" y="615" width="250" height="42" rx="4" fill="#cfd8dc" stroke="#90a4ae" stroke-width="0.8"/>
  <text x="495" y="632" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">F4: 分层存储</text>
  <text x="495" y="649" text-anchor="middle" font-size="7.5" fill="#555">LMCacheAscend  ·  SimpleCPUOffload  ·  lazy_offload</text>

  <rect x="640" y="615" width="410" height="42" rx="4" fill="#cfd8dc" stroke="#90a4ae" stroke-width="0.8"/>
  <text x="845" y="632" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">F5 引擎支撑: --scheduling-policy priority</text>
  <text x="845" y="649" text-anchor="middle" font-size="7.5" fill="#555">PriorityRequestQueue · priority 透传 · extra_body</text>

  <!-- Arrow L2 → L1 -->
