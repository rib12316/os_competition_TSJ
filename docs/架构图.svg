  <!-- Background -->
  <rect width="1100" height="920" fill="#fafafa"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a237e">面向智能体的内存管理系统 — 总体架构</text>

  <!-- ===== Layer 5: 展示交互层 ===== -->
  <rect x="30" y="56" width="1040" height="130" rx="8" fill="url(#box5)" stroke="#7b1fa2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="56" width="1040" height="30" rx="8" fill="url(#l5)"/>
  <rect x="30" y="76" width="1040" height="10" fill="url(#l5)"/>
  <text x="550" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="white">第五层 — 展示交互层</text>

  <rect x="55" y="96" width="200" height="40" rx="5" fill="white" stroke="#7b1fa2" stroke-width="1"/>
  <text x="155" y="113" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a148c">Gradio 前端 (7 Tab)</text>
  <text x="155" y="127" text-anchor="middle" font-size="8" fill="#666">Chat / τ-bench / F5 并发演示</text>

  <rect x="275" y="96" width="170" height="40" rx="5" fill="white" stroke="#7b1fa2" stroke-width="1"/>
  <text x="360" y="113" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a148c">EngineManager</text>
  <text x="360" y="127" text-anchor="middle" font-size="8" fill="#666">引擎启停 / 配置热切换</text>

  <rect x="465" y="96" width="180" height="40" rx="5" fill="white" stroke="#7b1fa2" stroke-width="1"/>
  <text x="555" y="113" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a148c">LiveMonitor</text>
  <text x="555" y="127" text-anchor="middle" font-size="8" fill="#666">HBM / KV hit / TTFT / QPS</text>

  <rect x="665" y="96" width="190" height="40" rx="5" fill="white" stroke="#7b1fa2" stroke-width="1"/>
  <text x="760" y="113" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a148c">优化效果对比</text>
  <text x="760" y="127" text-anchor="middle" font-size="8" fill="#666">Before/After 图表</text>

  <rect x="875" y="96" width="170" height="40" rx="5" fill="white" stroke="#7b1fa2" stroke-width="1"/>
  <text x="960" y="113" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a148c">架构总览</text>
  <text x="960" y="127" text-anchor="middle" font-size="8" fill="#666">特征→机制映射</text>

