  <text x="875" y="264" text-anchor="middle" font-size="7.5" fill="#004d40">PriorityEviction</text>

  <rect x="940" y="246" width="100" height="28" rx="3" fill="#e0f2f1" stroke="#80cbc4" stroke-width="0.8"/>
  <text x="990" y="264" text-anchor="middle" font-size="7.5" fill="#004d40">EvictionTracker</text>

  <text x="805" y="298" text-anchor="middle" font-size="8" fill="#666">HBM 滞回准入(70%/85%) · idle→priority=100 · sweep 线程 · 回调注入</text>

