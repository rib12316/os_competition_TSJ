  <text x="805" y="235" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#004d40">并发会话调度系统</text>

  <rect x="572" y="246" width="110" height="28" rx="3" fill="#e0f2f1" stroke="#80cbc4" stroke-width="0.8"/>
  <text x="627" y="264" text-anchor="middle" font-size="7.5" fill="#004d40">SessionManager</text>

  <rect x="690" y="246" width="120" height="28" rx="3" fill="#e0f2f1" stroke="#80cbc4" stroke-width="0.8"/>
  <text x="750" y="264" text-anchor="middle" font-size="7.5" fill="#004d40">AdmissionController</text>

