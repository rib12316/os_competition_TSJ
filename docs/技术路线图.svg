<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" font-family="'Microsoft YaHei','SimHei','WenQuanYi Micro Hei',sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a237e"/><stop offset="100%" stop-color="#283593"/></linearGradient>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0d47a1"/><stop offset="100%" stop-color="#1565c0"/></linearGradient>
    <linearGradient id="eng" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#37474f"/><stop offset="100%" stop-color="#455a64"/></linearGradient>
    <linearGradient id="sched" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#004d40"/><stop offset="100%" stop-color="#00695c"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" fill="#546e7a"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" fill="#1565c0"/></marker>
  </defs>

  <rect width="900" height="1280" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">面向智能体的内存管理系统 — 技术路线图</text>
  <text x="450" y="52" text-anchor="middle" font-size="10" fill="#999">一条任务从发起到完成的完整处理链路</text>

  <!-- ========== 1. 任务发起 ========== -->
  <rect x="250" y="72" width="400" height="32" rx="16" fill="url(#hdr)" filter="url(#sh)"/>
  <text x="450" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Benchmark Runner / 前端用户  发起任务</text>
  <path d="M450,104 L450,118" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== 2. 配置加载 ========== -->
  <rect x="150" y="122" width="600" height="55" rx="6" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#sh)"/>
  <text x="450" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a237e">① 配置加载</text>
  <text x="450" y="160" text-anchor="middle" font-size="9" fill="#555">读取 yaml 预设 → 决定启用模块:  middleware.active=[lazyload,compress]  ·  c8.enabled=true  ·  session.strategy=idle</text>
  <path d="M450,177 L450,191" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== 3. Agent ReAct 大框 ========== -->
  <rect x="30" y="196" width="840" height="560" rx="8" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,3" filter="url(#sh)"/>
  <rect x="30" y="196" width="840" height="28" rx="8" fill="url(#ag)"/>
  <rect x="30" y="214" width="840" height="10" fill="url(#ag)"/>
  <text x="450" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Agent ReAct 循环</text>

  <!-- Step 1: 构造上下文 -->
  <rect x="60" y="240" width="780" height="50" rx="5" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="450" y="260" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0d47a1">② 构造上下文</text>
  <text x="450" y="278" text-anchor="middle" font-size="8.5" fill="#555">System Prompt (静态精简后 ~445 token) + Tools Schema (描述去重, C1/C2 共享约定) + 对话历史 (冷热分层)</text>
  <path d="M450,290 L450,304" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Step 2: Middleware transform -->
  <rect x="60" y="308" width="780" height="70" rx="5" fill="#e8eaf6" stroke="#7986cb" stroke-width="1"/>
  <text x="450" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#283593">③ MiddlewareStack.transform_request()</text>
  <rect x="90" y="335" width="350" height="33" rx="3" fill="white" stroke="#9fa8da" stroke-width="0.8"/>
  <text x="265" y="349" text-anchor="middle" font-size="9" font-weight="bold" fill="#283593">F3: 注入 fetch_tool_result schema</text>
  <text x="265" y="363" text-anchor="middle" font-size="7.5" fill="#666">从首轮起稳定注入, 保证 tools 前缀一致 → APC 友好</text>

  <rect x="465" y="335" width="350" height="33" rx="3" fill="white" stroke="#9fa8da" stroke-width="0.8"/>
  <text x="640" y="349" text-anchor="middle" font-size="9" font-weight="bold" fill="#283593">F2: 冷热切分 → 达阈值? → BERT 压缩 / 复用缓存</text>
  <text x="640" y="363" text-anchor="middle" font-size="7.5" fill="#666">冷区 ≥ 8k token 触发 · 冻结段增量复用 · 三级缓存(78%复用率)</text>
  <path d="M450,378 L450,392" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Step 3: vLLM engine -->
  <rect x="60" y="396" width="780" height="90" rx="5" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="450" y="414" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#37474f">④ 发送请求 → vLLM 引擎 (OpenAI-compatible API)</text>

  <rect x="85" y="425" width="185" height="52" rx="3" fill="white" stroke="#b0bec5" stroke-width="0.8"/>
  <text x="177" y="440" text-anchor="middle" font-size="9" font-weight="bold" fill="#37474f">APC 前缀匹配</text>
  <text x="177" y="455" text-anchor="middle" font-size="7.5" fill="#666">Block 哈希命中 → 复用 KV</text>
  <text x="177" y="469" text-anchor="middle" font-size="7.5" fill="#666">未命中 → Block 分配 → Prefill</text>

  <rect x="282" y="425" width="175" height="52" rx="3" fill="white" stroke="#b0bec5" stroke-width="0.8"/>
  <text x="369" y="440" text-anchor="middle" font-size="9" font-weight="bold" fill="#37474f">F1: C8 KV 量化</text>
  <text x="369" y="455" text-anchor="middle" font-size="7.5" fill="#666">int8 scale 反量化 K/V</text>
  <text x="369" y="469" text-anchor="middle" font-size="7.5" fill="#666">FULL_DECODE_ONLY 模式</text>

  <rect x="470" y="425" width="185" height="52" rx="3" fill="white" stroke="#b0bec5" stroke-width="0.8"/>
  <text x="562" y="440" text-anchor="middle" font-size="9" font-weight="bold" fill="#37474f">F4: 分层存储</text>
  <text x="562" y="455" text-anchor="middle" font-size="7.5" fill="#666">冷 block → CPU/Disk offload</text>
  <text x="562" y="469" text-anchor="middle" font-size="7.5" fill="#666">lazy_offload: 淘汰前留副本</text>

  <rect x="668" y="425" width="150" height="52" rx="3" fill="white" stroke="#b0bec5" stroke-width="0.8"/>
  <text x="743" y="440" text-anchor="middle" font-size="9" font-weight="bold" fill="#37474f">F5: 优先级透传</text>
  <text x="743" y="455" text-anchor="middle" font-size="7.5" fill="#666">priority → extra_body</text>
  <text x="743" y="469" text-anchor="middle" font-size="7.5" fill="#666">PriorityRequestQueue</text>
  <path d="M450,486 L450,500" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Step 4: Response -->
  <rect x="60" y="504" width="780" height="38" rx="5" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="450" y="520" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0d47a1">⑤ 流式响应接收  +  TTFT 测量</text>
  <text x="450" y="535" text-anchor="middle" font-size="8.5" fill="#555">首 chunk 到达 → 记录 TTFT  ·  流结束 → 统计总 token + e2e 延迟</text>
  <path d="M450,542 L450,556" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Step 5: Parse -->
  <rect x="60" y="560" width="780" height="42" rx="5" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="450" y="578" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0d47a1">⑥ 解析响应 → 文本(结束) / tool_calls(继续)</text>

  <!-- branch -->
  <text x="260" y="614" text-anchor="middle" font-size="9" font-weight="bold" fill="#4caf50">文本消息 → 最终回复</text>
  <path d="M260,598 L260,614" stroke="#4caf50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="640" y="614" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff9800">tool_calls → 执行工具</text>
  <path d="M640,598 L640,614" stroke="#ff9800" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="490" y="620" width="300" height="28" rx="4" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
  <text x="640" y="639" text-anchor="middle" font-size="9" fill="#e65100">τ-bench env.step() / 业务工具函数</text>
  <path d="M640,648 L640,662" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Step 6: Middleware intercept -->
  <rect x="60" y="666" width="780" height="55" rx="5" fill="#e8eaf6" stroke="#7986cb" stroke-width="1"/>
  <text x="450" y="684" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#283593">⑦ MiddlewareStack.intercept_tool_result()</text>

  <rect x="130" y="695" width="310" height="20" rx="3" fill="white" stroke="#9fa8da" stroke-width="0.8"/>
  <text x="285" y="710" text-anchor="middle" font-size="8.5" fill="#283593">F3: ≥ 4000 token? → 存 SQLite → 替换为 &lt;512t 引用</text>

  <rect x="460" y="695" width="250" height="20" rx="3" fill="white" stroke="#9fa8da" stroke-width="0.8"/>
  <text x="585" y="710" text-anchor="middle" font-size="8.5" fill="#283593">&lt; 4000 token → 原样保留</text>
  <path d="M450,721 L450,735" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Loop back -->
  <rect x="300" y="738" width="300" height="22" rx="11" fill="#1565c0" opacity="0.1" stroke="#1565c0" stroke-width="1"/>
  <text x="450" y="753" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">⑧ 更新对话历史 → 回到 ② 下一轮</text>
  <path d="M150,749 L60,749 L60,260" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,3" fill="none"/>

  <!-- ReAct box end -->
  </g>

  <path d="M450,762 L450,778" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== F5 Concurrent ========== -->
  <rect x="130" y="784" width="640" height="80" rx="6" fill="#e0f2f1" stroke="#4db6ac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="450" y="804" text-anchor="middle" font-size="11" font-weight="bold" fill="#004d40">并发控制 (F5 — 会话感知调度, 每轮触发)</text>

  <rect x="150" y="815" width="290" height="40" rx="3" fill="white" stroke="#80cbc4" stroke-width="0.8"/>
  <text x="295" y="831" text-anchor="middle" font-size="9" font-weight="bold" fill="#004d40">AdmissionController</text>
  <text x="295" y="848" text-anchor="middle" font-size="8" fill="#555">HBM &gt; 85%? → 拒绝新请求 + 驱逐最老 idle session</text>

  <rect x="460" y="815" width="290" height="40" rx="3" fill="white" stroke="#80cbc4" stroke-width="0.8"/>
  <text x="605" y="831" text-anchor="middle" font-size="9" font-weight="bold" fill="#004d40">SessionManager + EvictionTracker</text>
  <text x="605" y="848" text-anchor="middle" font-size="8" fill="#555">idle→priority=100 · active→0 · 记录 idle_hit_rate</text>

  <path d="M450,864 L450,878" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== Metrics ========== -->
  <rect x="80" y="884" width="740" height="100" rx="6" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5" filter="url(#sh)"/>
  <text x="450" y="904" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">指标采集 (四条通道并行, 每轮/每2s)</text>

  <rect x="100" y="915" width="165" height="58" rx="3" fill="white" stroke="#ce93d8" stroke-width="0.8"/>
  <text x="182" y="932" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#4a148c">Runner 框架</text>
  <text x="182" y="947" text-anchor="middle" font-size="7.5" fill="#666">e2e P50/P95</text>
  <text x="182" y="961" text-anchor="middle" font-size="7.5" fill="#666">QPS · 成功率</text>

  <rect x="278" y="915" width="165" height="58" rx="3" fill="white" stroke="#ce93d8" stroke-width="0.8"/>
  <text x="360" y="932" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#4a148c">MemSampler</text>
  <text x="360" y="947" text-anchor="middle" font-size="7.5" fill="#666">npu-smi info</text>
  <text x="360" y="961" text-anchor="middle" font-size="7.5" fill="#666">HBM 时序 (2s间隔)</text>

  <rect x="456" y="915" width="165" height="58" rx="3" fill="white" stroke="#ce93d8" stroke-width="0.8"/>
  <text x="538" y="932" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#4a148c">vLLM /metrics</text>
  <text x="538" y="947" text-anchor="middle" font-size="7.5" fill="#666">KV hit · TTFT · TPOT</text>
  <text x="538" y="961" text-anchor="middle" font-size="7.5" fill="#666">preempt · running reqs</text>

  <rect x="634" y="915" width="165" height="58" rx="3" fill="white" stroke="#ce93d8" stroke-width="0.8"/>
  <text x="716" y="932" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#4a148c">事件日志</text>
  <text x="716" y="947" text-anchor="middle" font-size="7.5" fill="#666">F2_EVENT / F3_EVENT</text>
  <text x="716" y="961" text-anchor="middle" font-size="7.5" fill="#666">PROMPT_TOKEN_LOG</text>

  <path d="M450,984 L450,998" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== Output ========== -->
  <rect x="230" y="1004" width="440" height="36" rx="18" fill="url(#hdr)" filter="url(#sh)"/>
  <text x="450" y="1027" text-anchor="middle" font-size="12" font-weight="bold" fill="white">metrics.json  +  comparison.md  →  输出评测报告</text>

  <!-- Legend -->
  <rect x="60" y="1065" width="780" height="55" rx="5" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="90" y="1084" font-size="9" font-weight="bold" fill="#555">图例</text>

  <rect x="90" y="1094" width="14" height="14" rx="2" fill="#1565c0" opacity="0.3"/>
  <text x="110" y="1106" font-size="8" fill="#555">Agent ReAct 循环内部</text>

  <rect x="230" y="1094" width="14" height="14" rx="2" fill="#e8eaf6"/>
  <text x="250" y="1106" font-size="8" fill="#555">Middleware 处理</text>

  <rect x="370" y="1094" width="14" height="14" rx="2" fill="#eceff1"/>
  <text x="390" y="1106" font-size="8" fill="#555">vLLM 引擎处理</text>

  <rect x="520" y="1094" width="14" height="14" rx="2" fill="#e0f2f1"/>
  <text x="540" y="1106" font-size="8" fill="#555">F5 并发调度</text>

  <rect x="650" y="1094" width="14" height="14" rx="2" fill="#f3e5f5"/>
  <text x="670" y="1106" font-size="8" fill="#555">指标采集与输出</text>

  <!-- F1-F5 labels on the right -->
  <text x="865" y="460" font-size="8" fill="#999">F2 F3</text>
  <text x="865" y="690" font-size="8" fill="#999">F3</text>
  <text x="865" y="110" font-size="8" fill="#999">配置</text>

  <rect x="850" y="140" width="4" height="300" fill="#e8eaf6"/>
  <rect x="858" y="140" width="4" height="300" fill="#eceff1"/>
  <rect x="866" y="140" width="4" height="300" fill="#e0f2f1"/>
</svg>